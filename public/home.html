<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeachWiz — Find a tutor or learning center</title>
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/catalog.css">
  <script type="module" src="/catalog.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="TeachWiz home"><span class="brand-mark" aria-hidden="true">T</span>Teachwiz</a>
    <nav class="site-nav" aria-label="Main"><a href="/search?type=tutors">Tutors</a><a href="/search?type=centers">Centers</a><a href="/search?type=courses">Courses</a><a href="/for-centers">For centers</a></nav>
    <div class="header-actions">
      <div class="lang" role="group" aria-label="Language"><button type="button" aria-pressed="false">UZ</button><button type="button" aria-pressed="false">RU</button><button type="button" aria-pressed="true">EN</button></div>
      <a class="btn login-link" href="/login">Log in</a>
    </div>
  </header>
  <main class="home" data-catalog="home">
    <h1>Find the right tutor or learning center</h1>
    <form class="home-search" action="/search" method="get" role="search">
      <label class="field">What do you want to learn?<input name="q" placeholder="Subject, skill or course"></label>
      <a class="btn btn-soft" href="/search">Browse all</a>
      <button class="btn btn-primary" type="submit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg> Search</button>
    </form>
    <nav class="categories" aria-label="Popular subjects">
      <a href="/search?q=Math">Math</a><a href="/search?q=English">English</a><a href="/search?q=IELTS">IELTS</a><a href="/search?q=Programming">Programming</a><a href="/search?category=sat">SAT</a><a href="/search?category=presidential_school">Presidential School</a>
    </nav>
    <div class="home-catalog-heading"><h2>Explore verified listings</h2><a href="/search" class="back-link">View all →</a></div>
    <p class="status" id="catalog-status" role="status" aria-live="polite"></p>
    <div class="top-rated" id="catalog-list"></div>
    <noscript><p class="panel">Enable JavaScript to view the live catalog.</p></noscript>
  </main>
  <nav class="tabbar" aria-label="App"><a href="/" aria-current="page">Browse</a><a href="/search">Search</a><a href="/saved">Saved</a><a href="/account">Account</a></nav>
</body>
</html>
