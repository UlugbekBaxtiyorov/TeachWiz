<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — TeachWiz</title>
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/ui.css">
  <script type="module" src="/account.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="TeachWiz home"><span class="brand-mark" aria-hidden="true">T</span>Teachwiz</a>
    <nav class="site-nav" aria-label="Main"><a href="/search?type=tutors">Tutors</a><a href="/search?type=centers">Centers</a><a href="/search?type=courses">Courses</a><a href="/for-centers">For centers</a></nav>
    <div class="header-actions">
      <div class="lang" role="group" aria-label="Language"><button type="button" aria-pressed="false">UZ</button><button type="button" aria-pressed="false">RU</button><button type="button" aria-pressed="true">EN</button></div>
    </div>
  </header>
  <main class="narrow-page stack">
    <h1 class="page-title">Account</h1>
    <section class="panel stack" id="signed-out" hidden>
      <h2>Sign in to see your account</h2>
      <p class="muted">Keep track of the centers you contact and pick up where you left off.</p>
      <a class="btn btn-primary" href="/login">Log in</a>
      <a class="btn" href="/login#signup">Create account</a>
    </section>
    <section class="panel stack" id="signed-in" aria-labelledby="details-title" hidden>
      <h2 id="details-title" tabindex="-1">Your details</h2>
      <dl class="details"><dt>Email</dt><dd id="account-email"></dd><dt>Account type</dt><dd id="account-role"></dd></dl>
      <button class="btn" id="logout" type="button">Sign out</button>
    </section>
    <nav class="panel link-list" aria-label="Account shortcuts">
      <a href="/saved">Saved centers <span aria-hidden="true">›</span></a>
      <a href="/search">Find a tutor or center <span aria-hidden="true">›</span></a>
      <a href="/for-centers">List your center <span aria-hidden="true">›</span></a>
    </nav>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <nav class="tabbar" aria-label="App"><a href="/">Browse</a><a href="/search">Map</a><a href="/saved">Saved</a><a href="/account" aria-current="page">Account</a></nav>
</body>
</html>
