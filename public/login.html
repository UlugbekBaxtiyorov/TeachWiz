<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — TeachWiz</title>
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/ui.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="TeachWiz home"><span class="brand-mark" aria-hidden="true">T</span>Teachwiz</a>
    <nav class="site-nav" aria-label="Main"><a href="/search?type=tutors">Tutors</a><a href="/search?type=centers">Centers</a><a href="/search?type=courses">Courses</a><a href="/for-centers">For centers</a></nav>
    <div class="header-actions">
      <div class="lang" role="group" aria-label="Language"><button type="button" aria-pressed="false">UZ</button><button type="button" aria-pressed="false">RU</button><button type="button" aria-pressed="true">EN</button></div>
    </div>
  </header>
  <main class="narrow-page">
    <section class="panel form-panel" aria-label="TeachWiz account">
      <div id="auth-panel">
        <h1 id="form-title">Welcome back.</h1>
        <p class="muted" id="form-subtitle">Sign in and pick up where you left off.</p>
        <div class="segmented" aria-label="Account action">
          <button id="login-mode" type="button" aria-pressed="true">Sign in</button>
          <button id="signup-mode" type="button" aria-pressed="false">Create account</button>
        </div>
        <form id="auth-form" class="stack">
          <label class="field" for="email">Email address<input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" maxlength="254" required></label>
          <label class="field" for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="256" aria-describedby="password-hint" required></label>
          <p class="hint" id="password-hint">Use 8–128 characters. Spaces are welcome.</p>
          <button class="btn btn-primary" id="submit" type="submit">Sign in</button>
        </form>
      </div>
      <div id="session-panel" class="stack" hidden>
        <h1 tabindex="-1" id="session-title">You’re signed in.</h1>
        <dl class="details"><dt>Email</dt><dd id="account-email"></dd><dt>Account</dt><dd id="account-role"></dd></dl>
        <a class="btn btn-primary" href="/account">Go to your account</a>
        <button class="btn" id="logout" type="button">Sign out</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <noscript>Please enable JavaScript to sign in or create an account.</noscript>
    </section>
  </main>
  <nav class="tabbar" aria-label="App"><a href="/">Browse</a><a href="/search">Map</a><a href="/saved">Saved</a><a href="/account" aria-current="page">Account</a></nav>
</body>
</html>
